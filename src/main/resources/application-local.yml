# Local profile: in-memory H2 so the app boots with zero external dependencies.
# Swap to Testcontainers/PostgreSQL for the DATA-* exercises that need real
# database behavior (see TEST-03).
spring:
  datasource:
    url: jdbc:h2:mem:fundamentals;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
